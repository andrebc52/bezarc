<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Building Special Spaces</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fc;
      color: #1e1e2f;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      background: linear-gradient(
          rgba(0, 0, 0, 0.55),
          rgba(0, 0, 0, 0.55)
        ),
        url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1600&q=80')
        no-repeat center center/cover;
      color: #ffffff;
    }

    .hero-content {
      max-width: 900px;
    }

    .hero h1 {
      font-size: 6rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: 40px;
      color: #e0e0e0;
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-primary {
      background: #4a6cf7;
      color: #fff;
    }

    .btn-primary:hover {
      background: #3651d4;
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 2px solid #ffffff;
      color: #ffffff;
    }

    .btn-outline:hover {
      background: #ffffff;
      color: #1e1e2f;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.2rem;
      }

      .hero p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <h1>BEZARC</h1>
      <p>
        Building special spaces, creating cherished designs
      </p>      
    </div>
  </section>

</body>
</html>
